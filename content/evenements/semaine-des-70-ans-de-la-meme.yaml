description: >-
  Le cercle de médecine de l'UCLouvain Woluwe fête ses 70 ans toute la semaine
  (S8).


  Dimanche 1er novembre : somni édition spéciale 70 ans, avec une bière brassée
  par le cercle pour l'occasion. Lundi 2 : vernissage au bar du haut, archives
  et nouvelle fresque. Mardi 3 : bibitive matinale des praesidium de l'Anno 131
  (Ave confrater au champagne, chants, bière). Mercredi 4 : pré en Mémé du bas,
  présentation de la fresque du bas et jam session de 19h à 21h. Jeudi 5 :
  visite de Leuven et drink avec le cercle de médecine de Leuven.


  Le détail de chaque jour est sur l'événement Facebook.
