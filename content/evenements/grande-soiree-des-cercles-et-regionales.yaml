description: >-
  Une soirée pour réfléchir ensemble à l'avenir de la guindaille, dans le cadre
  du projet Cercles et Régios en Transition. Verre d'accueil à 18h30, début des
  échanges à 19h, clôture vers 22h. Le repas est offert.


  Au programme : 5 tables de discussion (consommation alimentaire et non
  alimentaire, finance durable, rites et traditions, rôle des organisations
  étudiantes dans la sensibilisation), avec les ambassadeurs Transition de
  l'UCLouvain, des kots-à-projet, les restos U, l'asbl GECo…


  Venez à 2 minimum par cercle ou régionale. Inscription obligatoire via le
  formulaire en lien sur l'événement Facebook.
