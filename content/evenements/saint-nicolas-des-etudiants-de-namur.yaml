description: |-
  La Saint-Nicolas des étudiants, c'est le grand rendez-vous du folklore namurois, organisé chaque début décembre par l'AGE avec les cercles et les kots-à-projets. Une tradition qui existe depuis 1981, et la dernière grosse fête avant le blocus.

  En 2026, elle se tient le mercredi 2 décembre à l'Arsenal. Horaires, préventes et programme sont annoncés par l'AGE dans les semaines qui précèdent. L'histoire et nos conseils sont dans notre guide de la Saint-Nicolas des étudiants, sur le blog NOVA.
