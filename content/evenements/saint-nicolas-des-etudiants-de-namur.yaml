description: |-
  La Saint-Nicolas des étudiants, c'est le grand rendez-vous du folklore namurois, organisé chaque début décembre par l'AGE avec les cercles et les kots-à-projets. Une tradition qui existe depuis 1981, et la dernière grosse fête avant le blocus.

  En 2026, elle se tient le mercredi 2 décembre sur le parking de l'Arsenal, de 14h à 19h (sortie définitive à 18h). Deux ambiances musicales, six bars décorés sur le thème des séries, des hot-dogs de l'AKàP et une safe zone place du Printemps de Pékin.

  Le forfait comprend Maes, Maes 0 % et Coca, avec de l'eau à tous les bars. Gobelet Rekwup sous caution de 1 €. Éthylotests sur place : si tu souffles 0,0 à la fin, on te rembourse 10 €.

  Préventes en ligne sur le site de l'AGE, et sur place à la MDE du 23 au 27 novembre, de 12h40 à 14h (lundi et mardi réservés aux étudiants de l'UNamur). L'histoire et nos conseils sont dans notre guide de la Saint-Nicolas des étudiants, sur le blog NOVA.
