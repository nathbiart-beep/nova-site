description: >-
  Le grand concours de don de sang revient à Louvain-la-Neuve, de la S8 à la
  S11 (du 2 au 27 novembre). Le principe : une équipe liée à un projet (kot-à-projet,
  cercle, régionale, scouts, asso…) récolte un maximum de dons, et les
  meilleures équipes repartent avec des lots, dont de l'argent pour financer
  leur projet.


  Tout le monde peut donner et offrir ses points à l'équipe de son choix : un
  don de sang vaut 1 point, le plasma 2, les plaquettes 3, les cellules
  souches 4, et même un refus rapporte 0,5 point. Attention, cette année les
  dons se font uniquement sur rendez-vous, via donneurdesang.be.
