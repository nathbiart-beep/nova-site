description: |-
  La Saint-Verhaegen, ou Saint-V, est la grande fête du folklore étudiant bruxellois. Elle commémore l'ouverture de l'ULB le 20 novembre 1834 et rend hommage à son fondateur, Pierre-Théodore Verhaegen. En 2026, elle tombe un vendredi.

  Le matin, l'ULB et la VUB organisent les commémorations officielles. Les étudiants se rassemblent ensuite au Grand Sablon, en tenue folklorique, avant le cortège à pied vers la Bourse en fin d'après-midi, où résonnent les chants universitaires. La fête continue le soir avec le TD de la Saint-V.

  Le programme détaillé (horaires, parcours, thème de l'année) est communiqué par l'ACE dans les jours qui précèdent. Histoire, traditions et conseils pratiques : tout est dans notre guide de la Saint-V, sur le blog NOVA.
