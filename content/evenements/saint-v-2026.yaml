description: |-
  « Changez vos mentalités, pas nos libertés - Haar stem mag klinken, laat geweld verdrinken »

  Le 20 novembre, l'ACE et la BSG donnent rendez-vous à tous les étudiants place du Grand Sablon pour fêter la Saint-V. Le thème de cette année : les violences faites aux femmes, pour rappeler que le combat n'est jamais terminé. Association mise en avant : Talita asbl.

  Jeudi 19 novembre, 22h - 4h : TD pré Saint-V à la salle Jefke, organisé par le Cercle du Libre Examen.

  Vendredi 20 novembre, 12h - 16h : festivités place du Grand Sablon.

  16h - 18h : cortège vers la place de la Bourse.

  19h - 23h : banquet de l'UAE à la Maison des Anciens.

  20h - 0h : soirées pré-TD dans les cercles du Solbosch et de la Plaine.

  22h - 3h30 : TD Saint-V à la salle Jefke.

  NOVA est partenaire de la Saint-V 2026 et couvre la journée en photos et en vidéo sur Instagram (@novastudent.be).

  Histoire, traditions et conseils pratiques : tout est dans notre guide de la Saint-V, sur le blog NOVA.
