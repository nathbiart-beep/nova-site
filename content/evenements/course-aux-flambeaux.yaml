description: >-
  La course relais la plus illuminée de LLN revient. Par équipes de 4, vous
  vous passez le flambeau sur une boucle d'environ 1 km dans le centre pendant
  1h30 : l'équipe qui fait le plus de tours gagne (comptage électronique).


  Rendez-vous à 19h sur la Grand-Place, départ à 20h. 35 € par équipe, un
  t-shirt offert à chaque coureur. Trois catégories : garçons, filles et
  mixtes. 125 équipes maximum, dont au moins 15 mixtes et 15 féminines.


  Les inscriptions se font en ligne via le lien posté sur l'événement Facebook
  (une seule personne inscrit l'équipe). Les dossards se récupèrent en S9. Tu
  veux participer sans courir ? Deviens bénévole.
