description: >-
  La Marchoise fait vivre le folklore de Marche-en-Famenne à LLN toute la
  journée.


  12h : pain saucisse et bière au CESEC. 13h : départ du cortège de la Petite
  Biesse, avec danses et arrêts dans la ville. 16h-19h : reconstitution du
  Marché 1900 place des Blancs Chevaux (jeux en bois, jeu du clou, lancer de
  ballots, danses folkloriques). 21h-3h : soirée parents en Carolo.
